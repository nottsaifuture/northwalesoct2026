  .flag .st{font-size:9px;letter-spacing:.08em;opacity:.65;margin-top:1px}
  .flag.upcoming{opacity:.62}
  .flag.here{transform-origin:50% 100%}
  .flag.goal{background:var(--gold);color:#3a2a00;border-left-color:#b33a1e}

   kind  : a key of PROPS below (write a new prop when nothing fits).

   goal  : true on the one stop the whole day is heading for (gold flag).
   minor : true = a small supporting stop (car park, ticket desk): small prop, small flag, short pause.
   info  : ['line', 'line'] = practical detail shown under the caption while there (address, postcode, price, warning).

/* ═══════════════════════════════════════════════════════════════════════
   2. THEMES — three different CONCEPTS, not three palettes.
   ink*    : the two tones everything wears BEFORE it is visited.
   pal     : real colours, used by PROPS once the travellers arrive.
   ground  : paints the ground twice — col=false (blank) and col=true
             (coloured). Colour is revealed through a mask as they walk.
   See references/themes.md to add a new one.
   ═══════════════════════════════════════════════════════════════════════ */
const BASE_PAL={wall:'#fff1dc',roof:'#d9483b',accent:'#f2b632',leaf:'#63a94a',leaf2:'#8cc968',trunk:'#8a5a3c',
  stone:'#c9c2b6',gold:'#f5c542',water:'#62b6dc',white:'#ffffff',dark:'#39424e',pink:'#f29bb2'};
const THEMES = {
  platter:{
    label:'Blue-willow platter', tag:{en:'A blue-willow platter takes colour',zh:'青花大盤,一路染上顏色'},
    shape:'ellipse', fit:.74, landW:7.5, sky:'#e9e2d3', table:'gingham', tableColor:'#c9d6ea',
    inkLight:'#f3f6fb', inkDark:'#1e3f8f', css:{ink:'#1e3f8f',paper:'#ffffff',cap:'#ffffff'},
    sun:'#fff3df', sunI:2.3, amb:'#eaf0ff', ambI:1.15, clouds:3, lights:false,
    scatter:['tree','tree','pine','bush','rock'], pal:{...BASE_PAL},
    ground(ctx,W,H,col,a){
      const cx=W/2,cy=H/2,cob='#1e3f8f',E=k=>{ctx.beginPath();ctx.ellipse(cx,cy,cx*k,cy*k,0,0,7)};
      ctx.fillStyle=col?'#fbf7ee':'#f6f8fb';ctx.fillRect(0,0,W,H);
      // land = a fat stroke along the road, so the island always fits the schedule
      if(col){a.road(a.landW*a.S,'#b9dc98');a.road(a.landW*.72*a.S,'#cfe8b0');a.blobs('#a9d286',40,a.S*1.1)}
      else{a.road(a.landW*a.S,cob);a.road(a.landW*a.S-7,'#f6f8fb');a.road(a.landW*.7*a.S,cob,[3,9]);a.road(a.landW*.7*a.S-3,'#f6f8fb')}
      a.river(col?'#8ccbe6':cob,col?a.S*1.5:3,!col);
      if(col){a.road(a.S*1.25,'#f3dfae')}else{a.road(3,cob,[10,10])}
      // rim band with motifs — the plate pattern
      E(.925);ctx.lineWidth=H*.085;ctx.strokeStyle=cob;ctx.stroke();
      E(.845);ctx.lineWidth=3;ctx.stroke();E(.83);ctx.lineWidth=1.5;ctx.stroke();
      for(let i=0;i<64;i++){const t=i/64*Math.PI*2,x=cx+Math.cos(t)*cx*.925,y=cy+Math.sin(t)*cy*.925;
        ctx.fillStyle=i%2?'#f6f8fb':(col?'#f5c542':'#9db4e6');ctx.beginPath();ctx.arc(x,y,i%2?H*.012:H*.02,0,7);ctx.fill()}
      ctx.fillStyle='#f6f8fb';ctx.font=`700 ${H*.034}px Georgia,serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      a.spaced('JOURNEY MAP  ·  旅 程 地 圖',cx,cy+cy*.925,H*.012);
    }},
  blueprint:{
    label:'Dawn blueprint', tag:{en:'A blueprint, painted as they walk',zh:'清晨的藍圖,走過的地方就上色'},
    shape:'rect', fit:1, landW:9, sky:'#1a2f73', table:'plain', tableColor:'#182a66',
    inkLight:'#cfdcff', inkDark:'#3355b5', css:{ink:'#1d3a8c',paper:'#eef3ff',cap:'#ffffff'},
    sun:'#ffd9b0', sunI:2.1, amb:'#93a8ff', ambI:1.0, clouds:0, lights:true,
    scatter:['tree','pine','bush','tree'], pal:{...BASE_PAL,wall:'#ffe9c9',roof:'#e2543f',leaf:'#5fae6a',leaf2:'#f2a7c3',water:'#7fc4ff'},
    ground(ctx,W,H,col,a){
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,col?'#2a4fb0':'#2743a0');g.addColorStop(1,col?'#1f3d95':'#213a8f');

      for(let v=0;v<=a.GH;v++){ctx.beginPath();ctx.moveTo(0,v*a.S);ctx.lineTo(W,v*a.S);
        ctx.strokeStyle=`rgba(255,255,255,${v%5?.05:.13})`;ctx.stroke()}

const box=(w,h,d,c,x=0,y=0,z=0)=>{const m=sh(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)));m.position.set(x,y+h/2,z);return m};

  st.slice(a).forEach((s,i)=>{s.x=b>1?15-30*i/(b-1):0;s.z=5+(i%2?-.8:.5)});
  return[...st.slice(0,a),{via:true,x:18,z:.8},...st.slice(a)]}

const people=(JOURNEY.travellers||[{color:'#e2543f',hat:'cap'}]).map(person);

/* ---- schedule → keyframes ---- */
const K=[];{let t=INTRO;STOPS.forEach((s,i)=>{if(i){const p=STOPS[i-1],d=Math.max(1.8,(s.u-p.u)*LEN/SPEED);K.push({t0:t,t1:t+d,u0:p.u,u1:s.u,idx:i-1,moving:true});t+=d}
  const dw=(s.minor?.6:1)*DWELL+(s.info?s.info.length*.7:0);s.tArrive=t;K.push({t0:t,t1:t+dw,u0:s.u,u1:s.u,idx:i,moving:false});t+=dw})}
const T_END=K[K.length-1].t1;
function stateAt(t){if(t<K[0].t0)return{u:STOPS[0].u,idx:-1,moving:false,done:false};
  if(t>=T_END)return{u:STOPS[STOPS.length-1].u,idx:STOPS.length-1,moving:false,done:true};
  const k=K.find(k=>t<k.t1);return{u:k.u0+(k.u1-k.u0)*ease((t-k.t0)/(k.t1-k.t0)),idx:k.idx,moving:k.moving,done:false}}

/* ---- labels + timeline ---- */
const flags=STOPS.map(s=>{const d=document.createElement('div');d.className='flag upcoming'+(s.goal?' goal':'')+(s.minor?' minor':'');
  d.innerHTML=`<div class="en"></div><div class="zh"></div><div class="st"></div>`;d.children[0].textContent=s.name.en;d.children[1].textContent=s.name.zh;
  $('#labels').appendChild(d);return d});
const tbtns=STOPS.map((s,i)=>{const b=document.createElement('button');b.innerHTML='<b></b><span></span>';b.children[0].textContent=s.time||String(i+1);
  b.children[1].textContent=s.name.zh===s.name.en||s.name.zh.includes(s.name.en.split(' ')[0])?s.name.zh:s.name.zh+' '+s.name.en;b.onclick=()=>seek(s.tArrive+.01);$('#timeline').appendChild(b);return b});
let capKey='';function caption(key,c,info){if(key===capKey)return;capKey=key;const el=$('#caption');el.classList.add('out');
  setTimeout(()=>{el.querySelector('.en').textContent=c.en;el.querySelector('.zh').textContent=c.zh;el.querySelector('.info').textContent=(info||[]).join('\n');el.classList.remove('out')},capKey===key?380:0)}

/* ---- playback ---- */
let time=0,playing=!reduced,stampI=0,finale=0,dirty=true,clock=0;
function resetReveal(){mctx.clearRect(0,0,CW,CH);stampI=0;finale=0;dirty=true;for(const o of objs){o.on=false;o.t=0;paint(o)}}
function seek(t){time=t;resetReveal();const s=stateAt(t);for(const o of objs)if(o.u<=s.u+LEAD){o.on=true;o.t=1;paint(o)}}
function setPlaying(v){playing=v;$('#bPlay').textContent=v?'❚❚':'▶'}
$('#bPlay').onclick=()=>{if(time>=T_END+4&&!playing)seek(0);setPlaying(!playing)};
$('#bReplay').onclick=()=>{seek(0);setPlaying(true)};
addEventListener('keydown',e=>{const s=stateAt(time);
  if(e.code==='Space'){e.preventDefault();$('#bPlay').click()}
  if(e.code==='ArrowRight')seek(STOPS[Math.min(STOPS.length-1,s.idx+1)].tArrive+.01);
  if(e.code==='ArrowLeft')seek(STOPS[Math.max(0,s.idx-(s.moving?0:1))].tArrive+.01)});
if(reduced){seek(T_END+.1);finale=79}

/* ---- camera: fixed tilt (that is the 2.5D), follows the travellers ---- */
const camDir=new THREE.Vector3(0,.74,.67).normalize(),focus=new THREE.Vector3(0,0,1),pan=new THREE.Vector3();
let zoom=1.3,userZoom=1,W=1,H=1,fitZ=1;
function resize(){W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();fitZ=Math.min(2.1,Math.max(1,1.5/camera.aspect))}   /* portrait: crop the overview rather than shrink it to a dot */
addEventListener('resize',resize);resize();
{const c=$('#c');let drag=null;
  c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);c.style.cursor='grabbing'});
  c.addEventListener('pointermove',e=>{if(!drag)return;const k=.05*zoom*userZoom*fitZ*(900/H);pan.x-=(e.clientX-drag.x)*k;pan.z-=(e.clientY-drag.y)*k*1.4;
    pan.x=Math.max(-22,Math.min(22,pan.x));pan.z=Math.max(-14,Math.min(14,pan.z));drag={x:e.clientX,y:e.clientY}});
  c.addEventListener('pointerup',()=>{drag=null;c.style.cursor='grab'});
  c.addEventListener('dblclick',()=>{pan.set(0,0,0);userZoom=1});
  c.addEventListener('wheel',e=>{e.preventDefault();userZoom=Math.max(.45,Math.min(1.6,userZoom*Math.exp(e.deltaY*.0012)))},{passive:false})}

/* ---- frame ---- */
const v3=new THREE.Vector3();let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;if(playing)time+=dt;
  const s=stateAt(time);
  // ground colour follows the road
  const lim=Math.min(N,Math.floor((s.u+LEAD)*N));while(stampI<=lim){stamp(SAMPLES[stampI],REVEAL_R);stampI+=5;dirty=true}
  if(s.done&&finale<80){finale=Math.min(80,finale+dt*20);stamp(goal.pos,finale);dirty=true}
  if(dirty){compose();dirty=false}
  // objects
  for(const o of objs){if(!o.on&&(o.u<=s.u+LEAD||(s.done&&o.pos.distanceTo(goal.pos)<finale)))o.on=true;
    if(o.on&&o.t<1){o.t=Math.min(1,o.t+dt*1.5);paint(o)}}
  for(const f of tickers)f(clock);
  for(const c of clouds){c.position.x+=c.userData.v*dt;if(c.position.x>28)c.position.x=-28}
  // travellers
  people.forEach((g,i)=>{const u=Math.max(0,s.u-i*.9/LEN),p=P(u),q=P(u+.004),dx=q.x-p.x,dz=q.z-p.z;
    const side=s.moving?0:(i-(people.length-1)/2)*.9;
    g.position.set(p.x+side,s.moving?Math.abs(Math.sin(clock*9+i))*.16:Math.sin(clock*2+i)*.02+.02,p.z+(s.moving?0:.5));
    const want=s.moving&&(dx||dz)?Math.atan2(dx,dz):0;let d=want-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*Math.min(1,dt*8)});
  // camera
  const overview=s.idx<0||s.done,wp=people[0].position;
  v3.set(overview?0:wp.x*.8,0,overview?1:wp.z*.6+1).add(pan);focus.lerp(v3,Math.min(1,dt*1.6));
  zoom+=((overview?1.3:STOPS.length>7?.98:.78)-zoom)*Math.min(1,dt*1.2);
  const dist=48*zoom*userZoom*fitZ;scene.fog.near=dist*1.5;scene.fog.far=dist*3.6;   // fog only eats the far table, never the board
  camera.position.copy(focus).addScaledVector(camDir,dist);camera.lookAt(focus);
  renderer.render(scene,camera);
  // labels
  STOPS.forEach((st,i)=>{const el=flags[i],done=s.done||i<s.idx||(i===s.idx),here=!s.done&&i===s.idx&&!s.moving;
    v3.set(st.land.x,st.top,st.land.z).project(camera);
    el.style.transform=`translate(${(v3.x*.5+.5)*W}px,${(-v3.y*.5+.5)*H-22}px) translate(-50%,-100%) scale(${here?1.12:1})`;
    el.style.zIndex=Math.round((1-v3.z)*1e5);
    const cls='flag'+(st.goal?' goal':'')+(st.minor?' minor':'')+(done?'':' upcoming')+(here?' here':'');if(el.className!==cls)el.className=cls;
    const stx=(st.time?st.time+' · ':'')+(done?(st.goal?'終點 arrived':'已到 visited'):(st.goal?'終點 the goal':'未到 upcoming'));
    if(el.children[2].textContent!==stx)el.children[2].textContent=stx;
    const bc=(done&&!here?'done':'')+(here?'here':'');if(tbtns[i].className!==bc)tbtns[i].className=bc});
  if(s.done)caption('outro',JOURNEY.outro);else if(s.idx<0)caption('intro',JOURNEY.intro||TH.tag);
  else if(!s.moving)caption('s'+s.idx,STOPS[s.idx].cap||STOPS[s.idx].name,STOPS[s.idx].info);
  else if(s.idx===0&&time<K[1].t0+1.2)caption('tag',TH.tag);
  if(s.done&&DAYS&&dayIdx<DAYS.length-1&&!$('#bNext')){const b=document.createElement('button');b.id='bNext';
    b.textContent='Next day 下一日 ▶';b.onclick=()=>goDay(dayIdx+1);$('#controls').prepend(b)}
  if(playing&&time>T_END+6)setPlaying(false);
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__diorama={seek,stateAt,T_END,STOPS,setPlaying,get time(){return time}};   // for testing from the console
</script>
